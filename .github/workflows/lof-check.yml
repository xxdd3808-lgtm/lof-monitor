name: LOF 折溢价检查与推送

on:
  schedule:
    # A 股交易时段每 30 分钟检查（北京时间 9:30-15:00 = UTC 1:30-7:00）
    - cron: '0 2 * * 1-5'     # UTC 02:00 = 北京 10:00
    - cron: '0 3 * * 1-5'     # UTC 03:00 = 北京 11:00
    - cron: '0 5 * * 1-5'     # UTC 05:00 = 北京 13:00
    - cron: '0 6 * * 1-5'     # UTC 06:00 = 北京 14:00
    - cron: '0 7 * * 1-5'     # UTC 07:00 = 北京 15:00
  workflow_dispatch:

concurrency:
  group: lof-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install akshare requests

      - name: 检查折溢价并推送
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python notify.py

      - name: 提交 state.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          else
            echo "[INFO] state.json 无变化，跳过提交"
          fi
